<style>
:root{
  --bg:#F8F7F2;
  --grey:#F2F2F2;
  --green:#2E5905;
  --ink:#1D2618;
  --line:rgba(29,38,24,.15);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1D2618;
    --grey:#26331f;
    --green:#9cc96b;
    --ink:#F8F7F2;
    --line:rgba(248,247,242,.2);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,system-ui,sans-serif;
  line-height:1.7;
}
h1,h2,h3{
  font-family:'Playfair Display',Georgia,serif;
  font-weight:400;
  line-height:1.1;
  margin:0;
}
nav{
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:14px 5vw;
  background:var(--bg);
  border-bottom:1px solid var(--line);
}
nav .links{display:flex;gap:20px;flex-wrap:wrap}
nav a{
  color:var(--ink);
  text-decoration:none;
  font-size:14px;
  transition:color .2s;
}
nav a:hover{color:var(--green)}
.lang button{
  border:1px solid var(--line);
  background:none;
  color:var(--ink);
  padding:4px 10px;
  cursor:pointer;
  font-size:13px;
}
.lang button.on{
  background:var(--green);
  color:#fff;
  border-color:var(--green);
}
section{
  padding:90px 5vw;
  max-width:1200px;
  margin:0 auto;
  animation:up .8s both;
}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.eyebrow{
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--green);
  margin-bottom:18px;
}
.hero{
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:6vw;
  align-items:center;
  min-height:80vh;
}
.hero h1{
  font-size:clamp(52px,7.5vw,100px);
  line-height:1;
  letter-spacing:-.015em;
}
.hero h1 span{display:block}
.hero h1 span+span{
  margin-left:.35em;
  font-style:italic;
  color:var(--green);
}
.hero p.intro{max-width:54ch;margin:0 0 12px}
.hero p.role{
  font-size:17px;
  color:var(--green);
  margin:22px 0 18px;
}
.btns{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px}
.btn{
  padding:12px 24px;
  border:1px solid var(--green);
  color:var(--green);
  text-decoration:none;
  background:none;
  cursor:pointer;
  font:inherit;
  font-size:14px;
  transition:.25s;
}
.btn.fill,.btn:hover{background:var(--green);color:#fff}
.btn.fill:hover{opacity:.85}
.photo{
  aspect-ratio:3/4;
  background:var(--grey);
  border:1px solid var(--line);
  display:grid;
  place-items:center;
  font-family:'Playfair Display',serif;
  font-size:64px;
  color:var(--green);
  margin-top:40px;
}
.cols{display:grid;grid-template-columns:1fr 2fr;gap:6vw}
h2{font-size:clamp(34px,4.5vw,56px)}
.cols p{margin:0 0 16px;max-width:60ch}
.sk2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:48px 6vw;
  margin-top:40px;
}
.blk h3{font-size:22px;margin-bottom:14px}
.li{
  padding:10px 0;
  border-top:1px solid var(--line);
  font-size:15px;
}
.lnk{
  color:var(--green);
  text-decoration:underline;
  text-underline-offset:4px;
  word-break:break-all;
  text-align:right;
}
.sheet ul{margin:0;padding-left:20px;opacity:.85}
.sheet li{margin-bottom:8px}
.sk{display:grid;grid-template-columns:1fr 1fr;gap:6vw}
.sk h3{font-size:24px;margin-bottom:16px}
.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:12px 0;
  border-top:1px solid var(--line);
}
.row span:last-child{color:var(--green)}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:24px;
  margin-top:40px;
}
.card{
  border:1px solid var(--line);
  background:var(--grey);
  transition:transform .3s;
}
.card:hover{transform:translateY(-4px)}
.ph{
  aspect-ratio:16/10;
  background:repeating-linear-gradient(
    45deg,
    var(--bg),
    var(--bg) 10px,
    var(--grey) 10px,
    var(--grey) 20px
  );
  display:grid;
  place-items:center;
  font-size:12px;
  opacity:.7;
}
.card div.b{padding:20px}
.card h3{font-size:22px;margin-bottom:8px}
.card p{margin:0;font-size:14px;opacity:.85}
button.card{
  text-align:left;
  color:inherit;
  font:inherit;
  cursor:pointer;
  padding:0;
  width:100%;
}
.card img{
  width:100%;
  aspect-ratio:16/10;
  object-fit:cover;
  display:block;
}
.modal{
  position:fixed;
  inset:0;
  z-index:10;
  background:rgba(29,38,24,.6);
  display:grid;
  place-items:center;
  padding:20px;
}
.sheet{
  background:var(--bg);
  max-width:640px;
  width:100%;
  max-height:90vh;
  overflow:auto;
  padding:36px;
  animation:up .4s both;
}
.sheet h3{font-size:32px;margin-bottom:6px}
.sheet h4{
  margin:22px 0 6px;
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--green);
}
.sheet p{margin:0;opacity:.85}
.sheet img{
  max-width:100%;
  height:auto;
  display:block;
}
footer{
  padding:30px 5vw;
  border-top:1px solid var(--line);
  font-size:13px;
  opacity:.7;
}

/* Blog */
.blog-card{width:100%;overflow:hidden}
.blog-card img{
  width:100%;
  aspect-ratio:16/10;
  object-fit:cover;
  display:block;
}
.blog-date{
  font-size:12px!important;
  color:var(--green);
  margin-bottom:8px!important;
}
.blog-empty{margin-top:30px;opacity:.7}
/* Hoạt động & Dự án: bài viết dạng chữ, không dùng ảnh minh họa */
.text-article-card{
  display:block;
  min-height:190px;
  padding:26px!important;
  text-align:left;
  color:var(--ink);
  background:var(--grey);
  border:1px solid var(--line);
  cursor:pointer;
  transition:transform .3s, border-color .3s;
}
.text-article-card:hover{
  transform:translateY(-4px);
  border-color:var(--green);
}
.text-article-card .b{padding:0!important}
.text-article-card h3{margin:8px 0 12px}
.text-article-card .article-read{
  color:var(--green);
  font-size:13px;
  margin-top:22px;
}
.blog-content{
  margin-top:28px;
  line-height:1.8;
  overflow-wrap:anywhere;
}
.blog-content h1,
.blog-content h2,
.blog-content h3{margin:24px 0 12px}
.blog-content p{margin:0 0 16px}
.blog-content img{max-width:100%;height:auto}
.blog-content ul,.blog-content ol{padding-left:24px}
.blog-content a{color:var(--green)}
.blog-content blockquote{
  border-left:3px solid var(--green);
  margin:20px 0;
  padding-left:16px;
  opacity:.8;

.project-links{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.project-links a{
  color:var(--green);
  text-decoration:underline;
  text-underline-offset:4px;
  font-size:14px;

@media(max-width:800px){
  .hero,.cols,.sk,.sk2{grid-template-columns:1fr}
  .hero{min-height:0}
  section{padding:60px 5vw}
  .photo{max-width:320px}
  nav{align-items:flex-start;flex-wrap:wrap}
  nav .links{gap:12px}

</style>

        ${c.about.map((p,i)=>html`<p key=${i}>${p}</p>`)}
      </div>
    </div>
  </section>
`;

const Skills = ({c, groups}) => html`
  <section id="skills">
    <div class="eyebrow">02</div>
    <h2>${c.skillsT}</h2>
    <div class="sk2">
      <div class="blk">
        <h3>${c.langT}</h3>
        ${c.langs.map(([a,b])=>html`
          <div class="row" key=${a}>
            <span>${a}</span>
            <span>${b}</span>
          </div>
        `)}
      </div>

      ${groups.map((g,i)=>html`
        <div class="blk" key=${g.h || i}>
          <h3>${g.h}</h3>
          ${g.i.map((x,j)=>html`
            <div class="li" key=${j}>${x}</div>
          `)}
        </div>
      `)}
    </div>
  </section>
`;

const ArticleSection = ({id, number, title, items, loading, empty, open, more}) => html`
  <section id=${id}>
    <div class="eyebrow">${number}</div>
    <h2>${title}</h2>
    ${loading
      ? html`<p class="blog-empty">Loading...</p>`
      : items.length === 0
        ? html`<p class="blog-empty">${empty}</p>`
        : html`
          <div class="grid">
            ${items.map((item,i)=>html`
              <button
                class="card text-article-card"
                key=${item.slug || i}
                onClick=${()=>open(item)}
              >
                <div class="b">
                  <p class="blog-date">${item.date || ""}</p>
                  <h3>${item.title || "Untitled"}</h3>
                  ${item.description ? html`<p>${item.description}</p>` : null}
                  <p class="article-read">${more} →</p>
                </div>
              </button>
            `)}
          </div>
        `
    }
  </section>
`;

const ArticleDetail = ({item, close, backLabel}) => {
  if (!item) return null;

  return html`
    <div class="modal" onClick=${close}>
      <article class="sheet" onClick=${e=>e.stopPropagation()}>
        <p class="blog-date">${item.date || ""}</p>
        <h3>${item.title || ""}</h3>
        ${item.description ? html`<p>${item.description}</p>` : null}
        <div
          class="blog-content"
          dangerouslySetInnerHTML=${{__html: item.body || "<p>Nội dung đang được cập nhật.</p>"}}
        ></div>
        <div class="btns">
          <button class="btn" onClick=${close}>${backLabel}</button>
        </div>
      </article>
    </div>
  `;
};

/* ---------- Blog ---------- */

const Blog = ({c, posts, loading, open}) => html`
  <section id="blog">
    <div class="eyebrow">05</div>
    <h2>${c.blogT}</h2>

    ${loading
      ? html`<p class="blog-empty">Loading...</p>`
      : posts.length === 0
        ? html`<p class="blog-empty">${c.blogEmpty}</p>`
        : html`
          <div class="grid">
            ${posts.map((post,i)=>html`
              <button
                class="card blog-card"
                key=${post.slug || i}
                onClick=${()=>open(post)}
              >
                ${post.thumbnail
                  ? html`
                    <img
                      src=${post.thumbnail}
                      alt=${post.title}
                      loading="lazy"
                    />
                  `
                  : html`<div class="ph">Blog</div>`
                }

                <div class="b">
                  <p class="blog-date">${post.date || ""}</p>
                  <h3>${post.title}</h3>
                  <p>${post.description || ""}</p>
                </div>
              </button>
            `)}
          </div>
        `
    }
  </section>
`;

const BlogDetail = ({post, close, c}) => {
  if (!post) return null;

  return html`
    <div class="modal" onClick=${close}>
      <article class="sheet" onClick=${e=>e.stopPropagation()}>
        <p class="blog-date">${post.date || ""}</p>
        <h3>${post.title}</h3>
        <p>${post.description || ""}</p>

        ${post.thumbnail
          ? html`
            <img
              src=${post.thumbnail}
              alt=${post.title}
              style=${{width:"100%",marginTop:"20px"}}
            />
          `
          : null
        }

        <div
          class="blog-content"
          dangerouslySetInnerHTML=${{__html: post.body || ""}}
        ></div>

        <div class="btns">
          <button class="btn" onClick=${close}>
            ${c.blogBack}
          </button>
        </div>
      </article>
    </div>
  `;
};

const Contact = ({c}) => html`
  <section id="contact">
    <div class="cols">
      <div>
        <div class="eyebrow">06</div>
        <h2>${c.contactT}</h2>
      </div>
      <div>
        ${c.cs.map(([a,b,h,nt])=>html`
          <div class="row" key=${a}>
            <span>${a}</span>
            <a
              class="lnk"
              href=${h}
              target=${nt?"_blank":null}
              rel=${nt?"noopener noreferrer":null}
            >${b}</a>
          </div>
        `)}
      </div>
    </div>
  </section>
`;

/* ---------- Ứng dụng chính ---------- */

function App(){
  const [lang,setLang] = useState("vi");

  const [skillData,setSkillData] = useState(null);

  const [posts,setPosts] = useState([]);
  const [loading,setLoading] = useState(true);
  const [activities,setActivities] = useState([]);
  const [activitiesLoading,setActivitiesLoading] = useState(true);
  const [projectPosts,setProjectPosts] = useState([]);
  const [projectsLoading,setProjectsLoading] = useState(true);

  const [selectedArticle,setSelectedArticle] = useState(null);
  const [selectedPost,setSelectedPost] = useState(null);

  const c = CONTENT[lang];

  // Đọc dữ liệu từ CMS
  React.useEffect(() => {
    fetch("/blog-index.json", {cache:"no-store"})
      .then(response => {
        if (!response.ok) throw new Error("Cannot load blog");
        return response.json();
      })
      .then(data => {
        setPosts(Array.isArray(data) ? data : []);
      })
      .catch(error => {
        console.error("Blog loading error:", error);
        setPosts([]);
      })
      .finally(() => {
        setLoading(false);
      });

    fetch("/activities-index.json", {cache:"no-store"})
      .then(response => {
        if (!response.ok) throw new Error("Cannot load activities");
        return response.json();
      })
      .then(data => setActivities(Array.isArray(data) ? data : []))
      .catch(error => {
        console.error("Activities loading error:", error);
        setActivities([]);
      })
      .finally(() => setActivitiesLoading(false));

    fetch("/project-index.json", {cache:"no-store"})
      .then(response => {
        if (!response.ok) throw new Error("Cannot load projects");
        return response.json();
      })
      .then(data => setProjectPosts(Array.isArray(data) ? data : []))
      .catch(error => {
        console.error("Project loading error:", error);
        setProjectPosts([]);
      })
      .finally(() => setProjectsLoading(false));

    fetch("/skill-index.json", {cache:"no-store"})
      .then(response => {
        if (!response.ok) throw new Error("Cannot load skills");
        return response.json();
      })
      .then(data => {
        setSkillData(Array.isArray(data) ? data : []);
      })
      .catch(error => {
        console.error("Skill loading error:", error);
        setSkillData([]);
      });
  }, []);

  // Dữ liệu dự phòng cho kỹ năng cũ
  const fallbackSkills = c.groups.map(g => ({
    h: g.h,
    i: g.i
  }));

  // Chuyển dữ liệu kỹ năng CMS theo ngôn ngữ
  const groups = skillData && skillData.length > 0
    ? skillData.map(g => {
        const translated = g[lang] || g.vi || {};

        return {
          h: translated.title || "",
          i: translated.items || []
        };
      })
    : fallbackSkills;

  document.documentElement.lang = lang;

  return html`
    <${Nav}
      c=${c}
      lang=${lang}
      setLang=${setLang}
    />

    <${Hero} c=${c}/>
    <${About} c=${c}/>

    <${Skills}
      c=${c}
      groups=${groups}
    />

    <${ArticleSection}
      id="activities"
      number="03"
      title=${c.expT}
      items=${activities}
      loading=${activitiesLoading}
      empty=${c.activityEmpty}
      open=${setSelectedArticle}
      more=${c.articleMore}
    />

    <${ArticleSection}
      id="projects"
      number="04"
      title=${c.projT}
      items=${projectPosts}
      loading=${projectsLoading}
      empty=${c.projectEmpty}
      open=${setSelectedArticle}
      more=${c.articleMore}
    />

    <${Blog}
      c=${c}
      posts=${posts}
      loading=${loading}
      open=${setSelectedPost}
    />

    <${Contact} c=${c}/>

    <footer>© 2026 ${NAME}</footer>

    <${ArticleDetail}
      item=${selectedArticle}
      close=${()=>setSelectedArticle(null)}
      backLabel=${c.blogBack}
    />

    <${BlogDetail}
      post=${selectedPost}
      close=${()=>setSelectedPost(null)}
      c=${c}
    />
  `;
}

ReactDOM.createRoot(
  document.getElementById("root")
).render(html`<${App}/>`);
</script>
</body>
</html>
