<style>
:root{
  --bg:#F8F7F2;
  --grey:#F2F2F2;
  --green:#2E5905;
  --ink:#1D2618;
  --line:rgba(29,38,24,.15);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1D2618;
    --grey:#26331f;
    --green:#9cc96b;
    --ink:#F8F7F2;
    --line:rgba(248,247,242,.2);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,system-ui,sans-serif;
  line-height:1.7;
}
h1,h2,h3{
  font-family:'Playfair Display',Georgia,serif;
  font-weight:400;
  line-height:1.1;
  margin:0;
}
nav{
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:14px 5vw;
  background:var(--bg);
  border-bottom:1px solid var(--line);
}
nav .links{display:flex;gap:20px;flex-wrap:wrap}
nav a{
  color:var(--ink);
  text-decoration:none;
  font-size:14px;
  transition:color .2s;
}
nav a:hover{color:var(--green)}
.lang button{
  border:1px solid var(--line);
  background:none;
  color:var(--ink);
  padding:4px 10px;
  cursor:pointer;
  font-size:13px;
}
.lang button.on{
  background:var(--green);
  color:#fff;
  border-color:var(--green);
}
section{
  padding:90px 5vw;
  max-width:1200px;
  margin:0 auto;
  animation:up .8s both;
}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.eyebrow{
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--green);
  margin-bottom:18px;
}
.hero{
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:6vw;
  align-items:center;
  min-height:80vh;
}
.hero h1{
  font-size:clamp(52px,7.5vw,100px);
  line-height:1;
  letter-spacing:-.015em;
}
.hero h1 span{display:block}
.hero h1 span+span{
  margin-left:.35em;
  font-style:italic;
  color:var(--green);
}
.hero p.intro{max-width:54ch;margin:0 0 12px}
.hero p.role{
  font-size:17px;
  color:var(--green);
  margin:22px 0 18px;
}
.btns{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px}
.btn{
  padding:12px 24px;
  border:1px solid var(--green);
  color:var(--green);
  text-decoration:none;
  background:none;
  cursor:pointer;
  font:inherit;
  font-size:14px;
  transition:.25s;
}
.btn.fill,.btn:hover{background:var(--green);color:#fff}
.btn.fill:hover{opacity:.85}
.photo{
  aspect-ratio:3/4;
  background:var(--grey);
  border:1px solid var(--line);
  display:grid;
  place-items:center;
  font-family:'Playfair Display',serif;
  font-size:64px;
  color:var(--green);
  margin-top:40px;
}
.cols{display:grid;grid-template-columns:1fr 2fr;gap:6vw}
h2{font-size:clamp(34px,4.5vw,56px)}
.cols p{margin:0 0 16px;max-width:60ch}
.education-heading{
  margin-top:28px;
  padding:20px 24px;
  border-left:4px solid var(--green);
  background:var(--grey);
}
.education-heading h3{
  color:var(--green);
  font-family:Inter,system-ui,sans-serif;
  font-size:18px;
  font-weight:600;
  line-height:1.5;
}
.education-heading p{margin:8px 0 0;font-size:15px}
.sk2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:48px 6vw;
  margin-top:40px;
}
.blk h3{font-size:22px;margin-bottom:14px}
.li{
  padding:10px 0;
  border-top:1px solid var(--line);
  font-size:15px;
}
.lnk{
  color:var(--green);
  text-decoration:underline;
  text-underline-offset:4px;
  word-break:break-all;
  text-align:right;
}
.sheet ul{margin:0;padding-left:20px;opacity:.85}
.sheet li{margin-bottom:8px}
.sk{display:grid;grid-template-columns:1fr 1fr;gap:6vw}
.sk h3{font-size:24px;margin-bottom:16px}
.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:12px 0;
  border-top:1px solid var(--line);
}
.row span:last-child{color:var(--green)}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:24px;
  margin-top:40px;
}
.card{
  border:1px solid var(--line);
  background:var(--grey);
  transition:transform .3s;
}
.card:hover{transform:translateY(-4px)}
.ph{
  aspect-ratio:16/10;
  background:repeating-linear-gradient(
    45deg,
    var(--bg),
    var(--bg) 10px,
    var(--grey) 10px,
    var(--grey) 20px
  );
  display:grid;
  place-items:center;
  font-size:12px;
  opacity:.7;
}
.card div.b{padding:20px}
.card h3{font-size:22px;margin-bottom:8px}
.card p{margin:0;font-size:14px;opacity:.85}
button.card{
  text-align:left;
  color:inherit;
  font:inherit;
  cursor:pointer;
  padding:0;
  width:100%;
}
.card img{
  width:100%;
  aspect-ratio:16/10;
  object-fit:cover;
  display:block;
}
.modal{
  position:fixed;
  inset:0;
  z-index:10;
  background:rgba(29,38,24,.6);
  display:grid;
  place-items:center;
  padding:20px;
}
.sheet{
  background:var(--bg);
  max-width:640px;
  width:100%;
  max-height:90vh;
  overflow:auto;
  padding:36px;
  animation:up .4s both;
}
.sheet h3{font-size:32px;margin-bottom:6px}
.sheet h4{
  margin:22px 0 6px;
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--green);
}
.sheet p{margin:0;opacity:.85}
.sheet img{
  max-width:100%;
  height:auto;
  display:block;
}
footer{
  padding:30px 5vw;
  border-top:1px solid var(--line);
  font-size:13px;
  opacity:.7;
}

/* Blog */
.blog-card{width:100%;overflow:hidden}
.blog-card img{
  width:100%;
  aspect-ratio:16/10;
  object-fit:cover;
  display:block;
}
.blog-date{
  font-size:12px!important;
  color:var(--green);
  margin-bottom:8px!important;
}
.blog-empty{margin-top:30px;opacity:.7}
.blog-content{
  margin-top:28px;
  line-height:1.8;
  overflow-wrap:anywhere;
}
.blog-content h1,
.blog-content h2,
.blog-content h3{margin:24px 0 12px}
.blog-content p{margin:0 0 16px}
.blog-content img{max-width:100%;height:auto}
.blog-content ul,.blog-content ol{padding-left:24px}
.blog-content a{color:var(--green)}
.blog-content blockquote{
  border-left:3px solid var(--green);
  margin:20px 0;
  padding-left:16px;
  opacity:.8;
}
.project-links{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.project-links a{
  color:var(--green);
  text-decoration:underline;
  text-underline-offset:4px;
  font-size:14px;
}

@media(max-width:800px){
  .hero,.cols,.sk,.sk2{grid-template-columns:1fr}
  .hero{min-height:0}
  section{padding:60px 5vw}
  .photo{max-width:320px}
  nav{align-items:flex-start;flex-wrap:wrap}
  nav .links{gap:12px}
}
</style>

        s:"한–베 IT 통역 교육",
        pts:[

          "IT 관련 상황에서 통번역을 실습했습니다.",
          "비즈니스 커뮤니케이션, 문서 작성, 회의 관련 업무 실무 역량을 키웠습니다.",
          "TOPCIT 2등급을 취득했습니다."
        ]
      },
      {
        t:"KITA 2026",
        s:"무역 실무 한국어",
        pts:[
          "국제무역 관련 실무 한국어 용어를 학습했습니다.",
          "비즈니스 서신 및 무역 문서 작성 역량을 키웠습니다.",
          "수출입 절차와 무역 실무의 기초를 학습했습니다.",
          "비즈니스·무역 상황에서 통번역을 실습했습니다."
        ]
      }
    ],
    dDesc: "개요",
    close: "닫기",
    blogT: "작은 공간",
    blogEmpty: "아직 등록된 콘텐츠가 없습니다.",
    blogBack: "블로그로 돌아가기",
    contactT: "연락처",
    cs:[
      ["이메일","mhien0795work@gmail.com",LINKS.email,0],
      ["LinkedIn","LinkedIn 프로필 보기",LINKS.linkedin,1],
      ["CV","Canva에서 CV 보기",LINKS.cv,1]
    ]
  }
};

const IDS = ["home","about","skills","activities","projects","blog","contact"];

/* ---------- Các thành phần giao diện ---------- */

const Nav = ({c, lang, setLang}) => html`
  <nav>
    <b style=${{fontFamily:"'Playfair Display',serif",fontSize:18}}>MTTH</b>
    <div class="links">
      ${IDS.map((id,i)=>html`
        <a key=${id} href=${"#"+id}>${c.nav[i]}</a>
      `)}
    </div>
    <div class="lang">
      ${["vi","en","ko"].map(l=>html`
        <button
          key=${l}
          class=${lang===l?"on":""}
          onClick=${()=>setLang(l)}
        >${l.toUpperCase()}</button>
      `)}
    </div>
  </nav>
`;

const Hero = ({c}) => html`
  <section id="home" class="hero">
    <div>
      <div class="eyebrow">${c.hello}</div>
      <h1>
        ${NAME_LINES.map(l=>html`<span key=${l}>${l}</span>`)}
      </h1>
      <p class="role">${c.role}</p>
      ${c.intro.map((p,i)=>html`
        <p key=${i} class="intro">${p}</p>
      `)}
      <div class="btns">
        <a class="btn fill" href="#projects">${c.b1}</a>
        <a class="btn" href="#contact">${c.b2}</a>
      </div>
    </div>
    <div class="photo">HT</div>
  </section>
`;

const About = ({c}) => html`
  <section id="about">
    <div class="cols">
      <div>
        <div class="eyebrow">01</div>
        <h2>${c.aboutT}</h2>
      </div>
      <div>
        ${c.about.map((p,i)=>html`<p key=${i}>${p}</p>`)}
      </div>
    </div>
  </section>
`;

const Skills = ({c, groups}) => html`
  <section id="skills">
    <div class="eyebrow">02</div>
    <h2>${c.skillsT}</h2>
    <div class="education-heading">
      <h3>${c.university}</h3>
      <p>${c.major}</p>
    </div>
    <div class="sk2">
      <div class="blk">
        <h3>${c.langT}</h3>
        ${c.langs.map(([a,b])=>html`
          <div class="row" key=${a}>
            <span>${a}</span>
            <span>${b}</span>
          </div>
        `)}
      </div>
      ${groups.map((g,i)=>html`
        <div class="blk" key=${g.h || i}>
          <h3>${g.h}</h3>
          ${g.i.map((x,j)=>html`
            <div class="li" key=${j}>${x}</div>
          `)}
        </div>
      `)}
    </div>
  </section>
`;

const ArticleSection = ({id, number, title, posts, loading, open, c}) => html`
  <section id=${id}>
    <div class="eyebrow">${number}</div>
    <h2>${title}</h2>
    ${loading
      ? html`<p class="blog-empty">Loading...</p>`
      : posts.length === 0
        ? html`<p class="blog-empty">${c.blogEmpty}</p>`
        : html`
          <div class="grid">
            ${posts.map((post,i)=>html`
              <button
                class="card blog-card"
                key=${post.slug || i}
                onClick=${()=>open(post)}
              >
                ${post.thumbnail
                  ? html`<img src=${post.thumbnail} alt=${post.title} loading="lazy"/>`
                  : html`<div class="ph">${c.img}</div>`
                }
                <div class="b">
                  <p class="blog-date">${post.date || ""}</p>
                  <h3>${post.title}</h3>
                  <p>${post.description || ""}</p>
                </div>
              </button>
            `)}
          </div>
        `
    }
  </section>
`;

const Detail = ({c, project, close}) => {
  if (!project) return null;

  return html`
    <div class="modal" onClick=${close}>
      <div class="sheet" onClick=${e=>e.stopPropagation()}>
        <h3>${project.t}</h3>
        <p>${project.s}</p>

        ${project.thumbnail
          ? html`
            <img
              src=${project.thumbnail}
              alt=${project.t}
              style=${{width:"100%",marginTop:"20px"}}
            />
          `
          : html`<div class="ph" style=${{margin:"20px 0 0"}}>${c.img}</div>`
        }

        <h4>${c.dDesc}</h4>
        <ul>
          ${project.pts.map((x,i)=>html`<li key=${i}>${x}</li>`)}
        </ul>

        ${(project.url || project.github)
          ? html`
            <div class="project-links">
              ${project.url
                ? html`<a href=${project.url} target="_blank" rel="noopener noreferrer">Website</a>`
                : null
              }
              ${project.github
                ? html`<a href=${project.github} target="_blank" rel="noopener noreferrer">GitHub</a>`
                : null
              }
            </div>
          `
          : null
        }

        <div class="btns">
          <button class="btn" onClick=${close}>${c.close}</button>
        </div>
      </div>
    </div>
  `;
};

/* ---------- Blog ---------- */

const Blog = ({c, posts, loading, open}) => html`
  <${ArticleSection}
    id="blog"
    number="05"
    title=${c.blogT}
    posts=${posts}
    loading=${loading}
    open=${open}
    c=${c}
  />
`;

const BlogDetail = ({post, close, c}) => {
  if (!post) return null;

  return html`
    <div class="modal" onClick=${close}>
      <article class="sheet" onClick=${e=>e.stopPropagation()}>
        <p class="blog-date">${post.date || ""}</p>
        <h3>${post.title}</h3>
        <p>${post.description || ""}</p>

        ${post.thumbnail
          ? html`
            <img
              src=${post.thumbnail}
              alt=${post.title}
              style=${{width:"100%",marginTop:"20px"}}
            />
          `
          : null
        }

        ${post.body
          ? html`<div class="blog-content" dangerouslySetInnerHTML=${{__html: post.body}}></div>`
          : null
        }
        ${post.details && post.details.length
          ? html`<div class="blog-content"><ul>${post.details.map((item,i)=>html`<li key=${i}>${item}</li>`)}</ul></div>`
          : null
        }

        <div class="btns">
          <button class="btn" onClick=${close}>
            ${c.blogBack}
          </button>
        </div>
      </article>
    </div>
  `;
};

const Contact = ({c}) => html`
  <section id="contact">
    <div class="cols">
      <div>
        <div class="eyebrow">06</div>
        <h2>${c.contactT}</h2>
      </div>
      <div>
        ${c.cs.map(([a,b,h,nt])=>html`
          <div class="row" key=${a}>
            <span>${a}</span>
            <a
              class="lnk"
              href=${h}
              target=${nt?"_blank":null}
              rel=${nt?"noopener noreferrer":null}
            >${b}</a>
          </div>
        `)}
      </div>
    </div>
  </section>
`;

/* ---------- Ứng dụng chính ---------- */

function App(){
  const [lang,setLang] = useState("vi");

  const [projectData,setProjectData] = useState(null);
  const [activityPosts,setActivityPosts] = useState([]);
  const [activityLoading,setActivityLoading] = useState(true);

  const [posts,setPosts] = useState([]);
  const [loading,setLoading] = useState(true);

  const [selectedActivity,setSelectedActivity] = useState(null);
  const [selectedProject,setSelectedProject] = useState(null);
  const [selectedPost,setSelectedPost] = useState(null);

  const c = CONTENT[lang];

  // Đọc dữ liệu từ CMS
  React.useEffect(() => {
    fetch("/blog-index.json", {cache:"no-store"})
      .then(response => {
        if (!response.ok) throw new Error("Cannot load blog");
        return response.json();
      })
      .then(data => {
        setPosts(Array.isArray(data) ? data : []);
      })
      .catch(error => {
        console.error("Blog loading error:", error);
        setPosts([]);
      })
      .finally(() => {
        setLoading(false);
      });

    fetch("/activity-index.json", {cache:"no-store"})
      .then(response => {
        if (!response.ok) throw new Error("Cannot load activities");
        return response.json();
      })
      .then(data => setActivityPosts(Array.isArray(data) ? data : []))
      .catch(error => {
        console.error("Activity loading error:", error);
        setActivityPosts([]);
      })
      .finally(() => setActivityLoading(false));

    fetch("/project-index.json", {cache:"no-store"})
      .then(response => {
        if (!response.ok) throw new Error("Cannot load projects");
        return response.json();
      })
      .then(data => {
        setProjectData(Array.isArray(data) ? data : []);
      })
      .catch(error => {
        console.error("Project loading error:", error);
        setProjectData([]);
      });

  }, []);

  // Dữ liệu dự phòng cho dự án cũ
  // Chuyển dữ liệu dự án CMS sang định dạng bài đăng như Blog
  const projects = projectData && projectData.length > 0
    ? projectData.map(p => {
        const translated = p[lang] || p.vi || {};
        return {
          slug: p.slug,
          title: translated.title || p.vi?.title || p.en?.title || p.ko?.title || "",
          date: p.date || "",
          description: translated.subtitle || translated.description || "",
          details: translated.details || [],
          body: translated.body || "",
          thumbnail: p.thumbnail || ""
        };
      })
    : c.projs.map((p,i) => ({
        slug: "default-" + i,
        title: p.t,
        date: "",
        description: p.s,
        details: p.pts,
        thumbnail: ""
      }));

  const activities = activityPosts.length
    ? activityPosts.map(p => {
        const translated = p[lang] || p.vi || {};
        return {
          slug: p.slug,
          title: translated.title || p.vi?.title || p.en?.title || p.ko?.title || "",
          date: p.date || "",
          description: translated.description || translated.subtitle || "",
          body: translated.body || "",
          details: translated.details || [],
          thumbnail: p.thumbnail || ""
        };
      })
    : c.acts.map((title,i) => ({
        slug: "activity-default-" + i,
        title,
        date: "",
        description: "",
        thumbnail: ""
      }));

  document.documentElement.lang = lang;

  return html`
    <${Nav}
      c=${c}
      lang=${lang}
      setLang=${setLang}
    />

    <${Hero} c=${c}/>
    <${About} c=${c}/>

    <${Skills}
      c=${c}
      groups=${c.groups}
    />

    <${ArticleSection}
      id="activities"
      number="03"
      title=${c.expT}
      posts=${activities}
      loading=${activityLoading}
      open=${setSelectedActivity}
      c=${c}
    />

    <${ArticleSection}
      id="projects"
      number="04"
      title=${c.projT}
      posts=${projects}
      loading=${false}
      open=${setSelectedProject}
      c=${c}
    />

    <${Blog}
      c=${c}
      posts=${posts}
      loading=${loading}
      open=${setSelectedPost}
    />

    <${Contact} c=${c}/>

    <footer>© 2026 ${NAME}</footer>

    <${BlogDetail}
      post=${selectedActivity}
      close=${()=>setSelectedActivity(null)}
      c=${c}
    />

    <${BlogDetail}
      post=${selectedProject}
      close=${()=>setSelectedProject(null)}
      c=${c}
    />

    <${BlogDetail}
      post=${selectedPost}
      close=${()=>setSelectedPost(null)}
      c=${c}
    />
  `;
}

ReactDOM.createRoot(
  document.getElementById("root")
).render(html`<${App}/>`);
</script>
</body>
</html>
