.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--green);margin-bottom:18px}

.btns{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px}

.btn.fill,.btn:hover{background:var(--green);color:#fff}.btn.fill:hover{opacity:.85}
.photo{aspect-ratio:3/4;background:var(--grey);border:1px solid var(--line);display:grid;place-items:center;font-family:'Playfair Display',serif;font-size:64px;color:var(--green);margin-top:40px}
.cols{display:grid;grid-template-columns:1fr 2fr;gap:6vw}
h2{font-size:clamp(34px,4.5vw,56px)}
.cols p{margin:0 0 16px;max-width:60ch}
.sk2{display:grid;grid-template-columns:1fr 1fr;gap:48px 6vw;margin-top:40px}.blk h3{font-size:22px;margin-bottom:14px}.li{padding:10px 0;border-top:1px solid var(--line);font-size:15px}.lnk{color:var(--green);text-decoration:underline;text-underline-offset:4px;word-break:break-all;text-align:right}.sheet ul{margin:0;padding-left:20px;opacity:.85}.sheet li{margin-bottom:8px}.sk{display:grid;grid-template-columns:1fr 1fr;gap:6vw}
.sk h3{font-size:24px;margin-bottom:16px}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row span:last-child{color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;margin-top:40px}
.card{border:1px solid var(--line);background:var(--grey);transition:transform .3s}
.card:hover{transform:translateY(-4px)}
.ph{aspect-ratio:16/10;background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 10px,var(--grey) 10px,var(--grey) 20px);display:grid;place-items:center;font-size:12px;opacity:.7}
.card div.b{padding:20px}.card h3{font-size:22px;margin-bottom:8px}.card p{margin:0;font-size:14px;opacity:.85}
button.card{text-align:left;color:inherit;font:inherit;cursor:pointer;padding:0}
.modal{position:fixed;inset:0;z-index:10;background:rgba(29,38,24,.6);display:grid;place-items:center;padding:20px}
.sheet{background:var(--bg);max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:36px;animation:up .4s both}
.sheet h3{font-size:32px;margin-bottom:6px}.sheet h4{margin:22px 0 6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.sheet p{margin:0;opacity:.85}
footer{padding:30px 5vw;border-top:1px solid var(--line);font-size:13px;opacity:.7}
@media(max-width:800px){.hero,.cols,.sk,.sk2{grid-template-columns:1fr}.hero{min-height:0}section{padding:60px 5vw}.photo{max-width:320px}}

  document.documentElement.lang = lang;
  return html`<${Nav} c=${c} lang=${lang} setLang=${setLang}/>
    <${Hero} c=${c}/><${About} c=${c}/><${Skills} c=${c}/><${Activities} c=${c}/>
    <${Projects} c=${c} open=${setProj}/><${Contact} c=${c}/>
    <footer>© 2026 ${NAME}</footer><${Detail} c=${c} i=${proj} close=${()=>setProj(null)}/>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
