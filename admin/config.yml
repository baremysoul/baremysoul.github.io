backend:
     name: github
     repo: baremysoul/baremysoul.github.io
     branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "vi"
publish_mode: simple

# Tên file không dấu, ví dụ "Dự án đầu tiên" -> du-an-dau-tien
slug:
  encoding: "ascii"
  clean_accents: true

collections:
  # BLOG
  - name: "blog"
    label: "Góc nhỏ"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Tiêu đề", name: "title", widget: "string" }
      - { label: "Ngày đăng", name: "date", widget: "datetime" }
      - { label: "Mô tả ngắn", name: "description", widget: "text" }
      - { label: "Ảnh bìa", name: "thumbnail", widget: "image", required: false }
      - { label: "Nội dung bài viết", name: "body", widget: "markdown" }

  # ACTIVITIES
  - name: "activities"
    label: "Hoạt động"
    folder: "content/activities"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Tiêu đề", name: "title", widget: "string" }
      - { label: "Ngày", name: "date", widget: "datetime", required: false }
      - { label: "Mô tả ngắn", name: "description", widget: "text" }
      - { label: "Ảnh bìa", name: "thumbnail", widget: "image", required: false }
      - { label: "Nội dung chi tiết", name: "body", widget: "markdown" }

  # PROJECTS
  - name: "projects"
    label: "Dự án"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    identifier_field: "title_vi"
    summary: "{{title_vi}}"
    fields:
      - { label: "Tiêu đề tiếng Việt", name: "title_vi", widget: "string" }
      - { label: "Title in English (không bắt buộc)", name: "title_en", widget: "string", required: false }
      - { label: "한국어 제목 (không bắt buộc)", name: "title_ko", widget: "string", required: false }

      - { label: "Ngày", name: "date", widget: "datetime", required: false }

      - { label: "Mô tả ngắn tiếng Việt", name: "subtitle_vi", widget: "string" }
      - { label: "Short description in English (không bắt buộc)", name: "subtitle_en", widget: "string", required: false }
      - { label: "한국어 설명 (không bắt buộc)", name: "subtitle_ko", widget: "string", required: false }

      - { label: "Ảnh bìa", name: "thumbnail", widget: "image", required: false }

      - { label: "Nội dung chi tiết tiếng Việt", name: "body_vi", widget: "markdown" }
      - { label: "Details in English (không bắt buộc, bỏ trống sẽ dùng bản tiếng Việt)", name: "body_en", widget: "markdown", required: false }
      - { label: "한국어 상세 내용 (không bắt buộc, bỏ trống sẽ dùng bản tiếng Việt)", name: "body_ko", widget: "markdown", required: false }

      - { label: "Link dự án", name: "url", widget: "string", required: false }
      - { label: "Link GitHub", name: "github", widget: "string", required: false }

  # EDUCATION
  - name: "education"
    label: "Học vấn"
    files:
      - name: "education"
        label: "Thông tin học vấn"
        file: "content/education/education.md"
        fields:
          - { label: "Tên trường - Tiếng Việt", name: "school_vi", widget: "string" }
          - { label: "School - English", name: "school_en", widget: "string" }
          - { label: "학교명 - 한국어", name: "school_ko", widget: "string" }
          - { label: "Ngành học - Tiếng Việt", name: "major_vi", widget: "string" }
          - { label: "Major - English", name: "major_en", widget: "string" }
          - { label: "전공 - 한국어", name: "major_ko", widget: "string" }
          - { label: "Chứng chỉ ngôn ngữ - Tiếng Việt", name: "language_vi", widget: "list", field: { label: "Chứng chỉ", name: "item", widget: "string" } }
          - { label: "Language certificates - English", name: "language_en", widget: "list", field: { label: "Certificate", name: "item", widget: "string" } }
          - { label: "어학 자격 - 한국어", name: "language_ko", widget: "list", field: { label: "자격", name: "item", widget: "string" } }
          - { label: "Kiến thức IT & kinh doanh - Tiếng Việt", name: "it_vi", widget: "list", field: { label: "Nội dung", name: "item", widget: "string" } }
          - { label: "IT & Business knowledge - English", name: "it_en", widget: "list", field: { label: "Content", name: "item", widget: "string" } }
          - { label: "IT 및 비즈니스 지식 - 한국어", name: "it_ko", widget: "list", field: { label: "내용", name: "item", widget: "string" } }

  # SKILLS
  - name: "skills"
    label: "Kỹ năng trong mục Học vấn"
    folder: "content/skills"
    create: true
    slug: "{{slug}}"
    identifier_field: "title_vi"
    summary: "{{title_vi}}"
    fields:
      - { label: "Tên nhóm tiếng Việt", name: "title_vi", widget: "string" }
      - { label: "Group title in English", name: "title_en", widget: "string" }
      - { label: "한국어 그룹명", name: "title_ko", widget: "string" }
      - { label: "Kỹ năng tiếng Việt", name: "items_vi", widget: "list", field: { label: "Kỹ năng", name: "item", widget: "string" } }
      - { label: "Skills in English", name: "items_en", widget: "list", field: { label: "Skill", name: "item", widget: "string" } }
      - { label: "한국어 역량", name: "items_ko", widget: "list", field: { label: "역량", name: "item", widget: "string" } }
