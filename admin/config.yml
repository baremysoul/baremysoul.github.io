
backend:
  name: github
  repo: nnga48031-lab/My-portfolio
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "vi"
publish_mode: simple

collections:
  # BLOG
  - name: "blog"
    label: "Bài viết"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: "Tiêu đề"
        name: "title"
        widget: "string"

      - label: "Ngày đăng"
        name: "date"
        widget: "datetime"

      - label: "Mô tả ngắn"
        name: "description"
        widget: "text"

      - label: "Ảnh bìa"
        name: "thumbnail"
        widget: "image"
        required: false

      - label: "Nội dung bài viết"
        name: "body"
        widget: "markdown"

  # PROJECTS
  - name: "projects"
    label: "Dự án"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Tiêu đề tiếng Việt"
        name: "title_vi"
        widget: "string"

      - label: "Title in English"
        name: "title_en"
        widget: "string"

      - label: "한국어 제목"
        name: "title_ko"
        widget: "string"

      - label: "Mô tả tiếng Việt"
        name: "subtitle_vi"
        widget: "string"

      - label: "Description in English"
        name: "subtitle_en"
        widget: "string"

      - label: "한국어 설명"
        name: "subtitle_ko"
        widget: "string"

      - label: "Chi tiết tiếng Việt"
        name: "details_vi"
        widget: "list"
        field:
          label: "Nội dung"
          name: "item"
          widget: "string"

      - label: "Details in English"
        name: "details_en"
        widget: "list"
        field:
          label: "Content"
          name: "item"
          widget: "string"

      - label: "한국어 상세 내용"
        name: "details_ko"
        widget: "list"
        field:
          label: "내용"
          name: "item"
          widget: "string"

      - label: "Ảnh dự án"
        name: "thumbnail"
        widget: "image"
        required: false

      - label: "Link dự án"
        name: "url"
        widget: "string"
        required: false

      - label: "Link GitHub"
        name: "github"
        widget: "string"
        required: false

  # SKILLS
  - name: "skills"
    label: "Kỹ năng"
    folder: "content/skills"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Tên nhóm tiếng Việt"
        name: "title_vi"
        widget: "string"

      - label: "Group title in English"
        name: "title_en"
        widget: "string"

      - label: "한국어 그룹명"
        name: "title_ko"
        widget: "string"

      - label: "Kỹ năng tiếng Việt"
        name: "items_vi"
        widget: "list"
        field:
          label: "Kỹ năng"
          name: "item"
          widget: "string"

      - label: "Skills in English"
        name: "items_en"
        widget: "list"
        field:
          label: "Skill"
          name: "item"
          widget: "string"

      - label: "한국어 역량"
        name: "items_ko"
        widget: "list"
        field:
          label: "역량"
          name: "item"
          widget: "string"
